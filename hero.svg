<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-label="Megha Mittal — Frontend Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Megha Mittal — Frontend Developer</title>
<desc>Animated hero with intro video, name, cycling roles and skills.</desc>
<defs>
<style>
text{font-family:ui-monospace,Menlo,Consolas,'Courier New',monospace}
.sg{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}
.sgm{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:500}
.b{font-weight:700}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes role{0%{opacity:0;transform:translateY(16px)}4%{opacity:1;transform:translateY(0)}22%{opacity:1;transform:translateY(0)}25.5%{opacity:0;transform:translateY(-16px)}100%{opacity:0;transform:translateY(-16px)}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(40px,-30px)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-50px,26px)}}
.fu{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
.fi{animation:fadeIn .7s ease both}
.role{animation:role 12s cubic-bezier(.2,.8,.2,1) infinite}
.blob{animation:drift 14s ease-in-out infinite alternate}
.blob2{animation:drift2 16s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
</linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r=".9" fill="#fff" fill-opacity=".06"/></pattern>
<filter id="blur60" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
<clipPath id="card"><rect width="1280" height="540" rx="26"/></clipPath>
<clipPath id="vid"><rect x="660" y="50" width="560" height="440" rx="20"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1280" height="540" fill="#0d0e16"/>
<rect width="1280" height="540" fill="url(#dots)"/>
<g filter="url(#blur60)" opacity=".55">
<circle class="blob" cx="170" cy="120" r="150" fill="#22d3ee" fill-opacity=".22"/>
<circle class="blob2" cx="470" cy="470" r="170" fill="#a78bfa" fill-opacity=".22"/>
<circle class="blob" cx="1150" cy="80" r="130" fill="#f472b6" fill-opacity=".14"/>
</g>

<!-- VIDEO GIF -->
<g class="fi" style="animation-delay:.3s">
<rect x="660" y="50" width="560" height="440" rx="20" fill="#151728"/>
<image clip-path="url(#vid)" x="660" y="50" width="560" height="440" preserveAspectRatio="xMidYMid slice" href="https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/video.gif" xlink:href="https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/video.gif"/>
<rect x="660" y="50" width="560" height="440" rx="20" fill="none" stroke="#a78bfa" stroke-opacity=".5" stroke-width="1.5"/>
<circle cx="686" cy="74" r="5" fill="#ef4444"><animate attributeName="opacity" values="1;.15;1" dur="1.2s" repeatCount="indefinite"/></circle>
<text class="b" x="698" y="79" font-size="12" fill="#eceef6" letter-spacing="2">REC</text>
</g>

<!-- LEFT COPY -->
<g class="fu" style="animation-delay:.2s">
<rect x="64" y="52" width="236" height="32" rx="16" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".45"/>
<circle cx="84" cy="68" r="4.5" fill="#34d399"/>
<text class="b" x="98" y="73" font-size="12" fill="#34d399" letter-spacing="1.6">OPEN TO COLLABS</text>
</g>
<text class="sgm fu" x="64" y="140" font-size="28" fill="#eceef6" style="animation-delay:.5s">Hi there, I'm</text>
<text class="sg fu" x="60" y="214" font-size="68" letter-spacing="-1.5" fill="url(#nameG)" style="animation-delay:.8s">Megha Mittal</text>
<rect x="64" y="234" width="120" height="3" rx="1.5" fill="url(#nameG)"/>

<text class="b fi" x="64" y="290" font-size="20" fill="#22d3ee" style="animation-delay:1.2s">&gt;</text>
<text class="role" x="90" y="290" font-size="20" fill="#eceef6" style="animation-delay:1.3s">Frontend Developer</text>
<text class="role" x="90" y="290" font-size="20" fill="#eceef6" opacity="0" style="animation-delay:4.3s">Motion &amp; GSAP Animator</text>
<text class="role" x="90" y="290" font-size="20" fill="#eceef6" opacity="0" style="animation-delay:7.3s">Anime Web Experiences</text>
<text class="role" x="90" y="290" font-size="20" fill="#eceef6" opacity="0" style="animation-delay:10.3s">AI-Assisted Builder</text>

<text class="sgm fu" x="64" y="334" font-size="17" fill="#8d93ab" style="animation-delay:1.8s">Crafting fast, responsive interfaces and cinematic,</text>
<text class="sgm fu" x="64" y="358" font-size="17" fill="#8d93ab" style="animation-delay:1.9s">anime-inspired web experiences with React &amp; GSAP.</text>

<!-- SKILLS -->
<g class="fu" style="animation-delay:2.3s" font-size="13">
<rect x="64" y="384" width="74" height="28" rx="14" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".5"/><text x="101" y="402" text-anchor="middle" fill="#22d3ee">React</text>
<rect x="146" y="384" width="70" height="28" rx="14" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".5"/><text x="181" y="402" text-anchor="middle" fill="#a78bfa">GSAP</text>
<rect x="224" y="384" width="96" height="28" rx="14" fill="#f472b6" fill-opacity=".1" stroke="#f472b6" stroke-opacity=".5"/><text x="272" y="402" text-anchor="middle" fill="#f472b6">Anime.js</text>
<rect x="328" y="384" width="104" height="28" rx="14" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".5"/><text x="380" y="402" text-anchor="middle" fill="#22d3ee">JavaScript</text>
<rect x="440" y="384" width="96" height="28" rx="14" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".5"/><text x="488" y="402" text-anchor="middle" fill="#a78bfa">HTML/CSS</text>
<rect x="64" y="420" width="132" height="28" rx="14" fill="#f472b6" fill-opacity=".1" stroke="#f472b6" stroke-opacity=".5"/><text x="130" y="438" text-anchor="middle" fill="#f472b6">AI-Assisted Dev</text>
</g>

<!-- META -->
<g class="fu" style="animation-delay:2.7s" font-size="14" fill="#8d93ab">
<text x="64" y="488">&#128205; Noida, India</text>
<text x="230" y="488">&#128188; Wiley</text>
<text x="330" y="488">&#9733; 54 stars &#183; 8 repos</text>
</g>
</g>
<rect x=".75" y=".75" width="1278.5" height="538.5" rx="25.5" fill="none" stroke="#262a42" stroke-width="1.5"/>
</svg>
